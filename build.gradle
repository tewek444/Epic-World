plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Optional client-only test mods in run/mods (e.g. Voxy via Sinytra Connector). Connector needs the clean,
            // Mojang-mapped Minecraft jar that NeoFormRuntime produced while setting up this workspace.
            def cleanJar = fileTree("${gradle.gradleUserHomeDir}/caches/neoformruntime/intermediate_results")
                    .matching { include 'rename_*_output.jar' }.files.sort { it.lastModified() }.find { true }
            if (cleanJar != null) systemProperty 'connector.clean.path', cleanJar.absolutePath
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // gradlew runClient -PquickPlay=<save>: opens that save directly, for quick in-game checks.
            if (project.hasProperty('quickPlay')) programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            // Experiment: gradlew runClient -PdeferDepth=false generates chunks in full, for comparison.
            if (project.hasProperty('deferDepth')) systemProperty 'epicworld.deferDepth', project.property('deferDepth').toString()
            // gradlew runClient -PautoBench=3: runs /epicworld benchmark that many times once in the world, then quits.
            if (project.hasProperty('autoBench')) systemProperty 'epicworld.autoBench', project.property('autoBench').toString()
            if (project.hasProperty('benchRadius')) systemProperty 'epicworld.benchRadius', project.property('benchRadius').toString()
            // gradlew runClient -Pjfr=<file.jfr>: Java Flight Recorder profile of the whole session.
            if (project.hasProperty('jfr')) jvmArguments.add("-XX:StartFlightRecording=filename=${project.property('jfr')},settings=profile".toString())
            if (project.hasProperty('jvmExtra')) jvmArguments.addAll(project.property('jvmExtra').toString().split(' '))
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // Separate directory: the client run directory may hold extra client-only test mods (Voxy, Sodium...).
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Sodium's config API, for the optional Epic World page in Sodium's video settings. Only compiled against: the page
    // is registered by Sodium itself (mods.toml property) and only when Sodium is installed. Put the Sodium mod jar
    // (the inner net.caffeinemc.sodium-neoforge-*-mod.jar) into libs/ to build.
    compileOnly files('libs/sodium-neoforge-0.8.13-compile-only.jar')
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('prepareEpicTestStructures', Copy) {
    from 'src/testStructures'
    into 'run-gametest/gameteststructures'
}
tasks.named('runGameTestServer') {
    dependsOn 'prepareEpicTestStructures'
}

// Plans the lift of an old world's chunks for conversion without touching the world: gradlew previewLift -Pworld=<folder>
tasks.register('previewLift', JavaExec) {
    group = 'epicworld'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.nyxia.epicworld.dev.LiftPreview'
    def world = file(project.findProperty('world') ?: 'run/saves/reverie')
    args = [world.absolutePath, file("build/reports/lift/${world.name}").absolutePath]
    maxHeapSize = '4G'
    systemProperty 'java.awt.headless', 'true'
    notCompatibleWithConfigurationCache('dev tool')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Fast terrain iteration without Minecraft: renders shaded biome maps and statistics from TerrainEngine.
tasks.register('renderTerrainMaps', JavaExec) {
    group = 'epicworld'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.nyxia.epicworld.dev.TerrainMaps'
    args = [file('build/reports/terrain').absolutePath, (project.findProperty('seeds') ?: '1,42,8675309').toString()]
    maxHeapSize = '2G'
    if (project.hasProperty('center')) systemProperty 'epicworld.center', project.property('center')
    if (project.hasProperty('probe')) systemProperty 'epicworld.probe', project.property('probe')
    if (project.hasProperty('ridges')) systemProperty 'epicworld.ridges', 'true'
    if (project.hasProperty('slivers')) systemProperty 'epicworld.slivers', project.property('slivers')
    if (project.hasProperty('regions')) systemProperty 'epicworld.regions', project.property('regions')
    if (project.hasProperty('regionsAt')) { systemProperty 'epicworld.regionsX', project.property('regionsAt').toString().split(',')[0]; systemProperty 'epicworld.regionsZ', project.property('regionsAt').toString().split(',')[1] }
    if (project.hasProperty('crossings')) systemProperty 'epicworld.crossings', project.property('crossings')
    if (project.hasProperty('tunnels')) systemProperty 'epicworld.tunnels', project.property('tunnels')
    if (project.hasProperty('sliversOut')) systemProperty 'epicworld.sliversOut', project.property('sliversOut')
    notCompatibleWithConfigurationCache('dev tool')
}

// Auto-incrementing build number, embedded in the jar file name only
// (mod metadata keeps the plain mod_version). The counter file is only
// written when the jar task actually executes, so IDE syncs and
// up-to-date builds never bump it.
def buildNumberFile = file("build-number.txt")
if (!buildNumberFile.exists()) {
    buildNumberFile.text = "1"
}
def buildNumber = buildNumberFile.text.trim().toInteger()
tasks.named("jar", Jar).configure {
    archiveVersion = "${mod_version}+build.${buildNumber}"
    doLast {
        buildNumberFile.text = "${buildNumber + 1}"
    }
}

// Perspective landscape views from the terrain engine (no Minecraft): -Pviews="seed:x,z,yaw,pitch,altitude;..." or "seed:auto".
tasks.register('renderTerrainView', JavaExec) {
    group = 'epicworld'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.nyxia.epicworld.dev.TerrainView'
    args = [file('build/reports/terrain').absolutePath]
    maxHeapSize = '3G'
    // Keep the PC cool: a few threads are plenty for a still image.
    jvmArgs '-Djava.util.concurrent.ForkJoinPool.common.parallelism=4'
    if (project.hasProperty('noCorridors')) systemProperty 'epicworld.noCorridors', 'true'
    if (project.hasProperty('views')) systemProperty 'epicworld.views', project.property('views')
    if (project.hasProperty('findAbove')) systemProperty 'epicworld.findAbove', project.property('findAbove')
    notCompatibleWithConfigurationCache('dev tool')
}
